# Simlink this to $USER/.config/alacritty/alacritty.toml
[font]
size = 20
# BIG - for when presenting
# size = 24
builtin_box_drawing = false

[hints]
# they are god ugly
enabled = []

[colors.bright]
black = "#665c54"
blue = "#bdae93"
cyan = "#d65d0e"
green = "#3c3836"
magenta = "#ebdbb2"
red = "#fe8019"
white = "#fbf1c7"
yellow = "#504945"

[colors.cursor]
cursor = "#d5c4a1"
text = "#1d2021"

[colors.normal]
black = "#1d2021"
blue = "#83a598"
cyan = "#8ec07c"
green = "#b8bb26"
magenta = "#d3869b"
red = "#fb4934"
white = "#d5c4a1"
yellow = "#fabd2f"

[colors.primary]
foreground = "#e7e5e4"
background = "#292524"

# Gruvbox colors
# background = "#2c2c2c"
# foreground = "#f5c4a1"

[terminal]
shell = "/opt/homebrew/bin/bash"

[keyboard]
bindings = [
  { key = "b", mods = "Command", action = "ReceiveChar" },
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" }
]

[window]
option_as_alt = "Both"
startup_mode = "Maximized"
